# Local-development defaults. Every key here can be overridden by an
# environment variable (dots -> underscores, upper-cased - e.g. api.base.url
# -> API_BASE_URL) or a -D system property, without editing this file - see
# paymentapi.config.Config and the README's "Configuration" section.

api.base.url=http://localhost:8000

# The platform administrator seeded by `python seed_admin.py` in payment_api.
# This suite only ever reads this account - no scenario changes its password
# or active status, so it is safe to reuse across runs and CI.
platform.admin.email=platform.admin@example.com
platform.admin.password=ChangeMe123!

# An invalid merchant API key, for negative X-Api-Key tests. Any 32+ char
# hex-looking string that the DB will never contain works.
auth.invalid.api.key=mk_0000000000000000000000000000000000000000000

# A structurally invalid JWT, for negative bearer-token tests.
auth.malformed.bearer.token=not-a-real-jwt-token

# Scenarios tagged @requires-rabbitmq need payment_api connected to a live
# broker (invoice/payment/upload creation, provider callback intake - every
# endpoint that publishes a queue message). Scenarios tagged @requires-consumer
# additionally need payment_consumers running against the same broker and
# database, since they wait for a queued invoice/payment to actually become a
# row. Exclude either with -Dcucumber.filter.tags, see the README.
wait.consumer.timeout.seconds=25
wait.consumer.poll.interval.ms=500
wait.queue.publish.timeout.seconds=10
wait.queue.publish.poll.interval.ms=300
